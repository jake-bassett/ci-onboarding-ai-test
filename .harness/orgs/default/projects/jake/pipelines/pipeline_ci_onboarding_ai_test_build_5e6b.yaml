pipeline:
  id: pipeline_ci_onboarding_ai_test_build_5e6b
  name: pipeline_ci_onboarding_ai_test_build_5e6b
  stages:
    - id: build_and_test
      name: Build and Test
      clone:
        enabled: true
      cache:
        enabled: true
      runtime:
        cloud: {}
      steps:
        - id: install_dependencies
          name: Install Dependencies
          run:
            container:
              image: node:22-bookworm
            shell: bash
            script: |-
              node --version
              npm --version
              npm install
        - id: test
          name: Test
          run:
            container:
              image: node:22-bookworm
            shell: bash
            script: |-
              mkdir -p .harness/reports .harness/coverage
              node --test \
                --experimental-test-coverage \
                --test-reporter=junit --test-reporter-destination=.harness/reports/junit.xml \
                --test-reporter=lcov --test-reporter-destination=.harness/coverage/lcov.info
            report:
              type: junit
              paths:
                - .harness/reports/junit.xml
        - id: upload_coverage
          name: Upload Coverage
          run:
            shell: bash
            script: |-
              test -s ".harness/coverage/lcov.info"
              hcli cov upload --file=".harness/coverage/lcov.info"
  tags:
    onboarding: "true"
