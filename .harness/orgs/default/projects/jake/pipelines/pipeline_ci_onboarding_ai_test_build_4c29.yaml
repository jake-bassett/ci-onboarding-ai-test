pipeline:
  id: pipeline_ci_onboarding_ai_test_build_4c29
  name: pipeline_ci_onboarding_ai_test_build_4c29
  stages:
    - id: build_test
      name: Build and Test
      runtime: cloud
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - id: test
          name: Test
          run:
            container:
              image: node:20
            shell: bash
            script: |-
              mkdir -p .harness/reports
              node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=.harness/reports/junit.xml
            report:
              type: junit
              paths:
                - .harness/reports/junit.xml
  tags:
    onboarding: "true"
